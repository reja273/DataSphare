<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="favicon.svg"><title>Account settings — DataSphare</title><link rel="stylesheet" href="style.css"><style>.account-page{max-width:760px;margin:56px auto;padding:24px}.account-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px;margin:20px 0;box-shadow:var(--shadow)}.danger-zone{border-color:#fecaca}.danger-zone h2{color:#b42318}.danger-zone input{width:100%;max-width:420px;padding:12px;border:1px solid var(--line);border-radius:10px;margin:8px 0 16px}.danger-button{background:#b42318;color:white;border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer}.danger-button:disabled{opacity:.6}</style></head><body>
<header class="site-header"><div class="site-header-inner"><a class="brand" href="index.html">DataSphare</a><nav class="site-nav"><a href="index.html">Home</a><a href="blog.html">Community</a></nav><div class="header-actions" data-auth-slot></div></div></header>
<main class="account-page"><p><a href="blog.html">← Community</a></p><h1>Account settings</h1><section class="account-card"><h2>Your account</h2><p id="accountInfo">Loading account…</p><a class="btn btn-primary" href="blog.html">Manage your stories</a></section><section class="account-card danger-zone"><h2>Delete account</h2><p>This permanently removes your account, stories, comments, likes and follows. This cannot be undone.</p><label for="deletePassword">Confirm your password</label><br><input id="deletePassword" type="password" autocomplete="current-password"><br><label><input id="confirmDelete" type="checkbox"> I understand this will permanently delete my account and content.</label><br><button class="danger-button" id="deleteAccount" type="button">Delete my account</button></section></main>
<script src="js/api.js"></script><script src="js/site.js"></script><script src="account.js"></script></body></html>
