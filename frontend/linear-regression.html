<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="assets/styles/normalize.css" />
    <link rel="stylesheet" href="assets/styles/font.css" />
    <link rel="stylesheet" href="assets/styles/katex.css" />
    <link rel="stylesheet" href="assets/styles/global.css" />
    <link rel="stylesheet" href="build/bundle.css" />

    <script defer src="build/bundle.js"></script>

    <!-- meta tags -->
    <title>Linear Regression — DataSphare</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="description"
      content="A visual, interactive explanation of linear regression for machine learning."
    />
    <meta
      name="keywords"
      content="linear regression classification threshold binary visual machine learning mean squared error r-squared gradient descent closed form least squares interpretability multivariate"
    />
    <meta property="og:title" content="Linear Regression — DataSphare" />
    <meta property="og:site_name" content="DataSphare" />
    <meta property="og:type" content="article" />
    <meta property="og:locale" content="en_US" />

    <!-- Playground styles & libraries -->
    <link rel="stylesheet" href="styles/ml-playground.css" />
    <link rel="stylesheet" href="styles/ml-python-code.css" />
    <script src="assets/plotly.min.js"></script>
  </head>

  <body>
    <!-- Svelte app renders here via bundle.js: new App({target: document.body}) -->

    <!-- Playground + Python code injected after Svelte loads -->
    <script>
      window.addEventListener('load', function () {
        // Create playground container at end of body
        var pgDiv = document.createElement('div');
        pgDiv.id = 'dataspharePlaygroundContainer';
        document.body.appendChild(pgDiv);

        // Load playground script then initialize
        var pgScript = document.createElement('script');
        pgScript.src = 'js/ml-playground.js';
        pgScript.onload = function () {
          DataSpharePlayground.init('dataspharePlaygroundContainer', { type: 'linear-regression' });
        };
        document.head.appendChild(pgScript);

        // Create Python code container
        var pyDiv = document.createElement('div');
        pyDiv.id = 'dsPythonCodeContainer';
        document.body.appendChild(pyDiv);

        // Load python code section script
        var pyScript = document.createElement('script');
        pyScript.src = 'js/ml-python-code.js';
        pyScript.onload = function () {
          DataSpharePyCode.init('dsPythonCodeContainer', { type: 'linear-regression' });
        };
        document.head.appendChild(pyScript);
      });
    </script>
  </body>
</html>
